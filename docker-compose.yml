# docker-compose for the ESCRO platform.
# Local dev:  docker compose --env-file .env.local up -d --build
# Prod:       docker compose --env-file .env.prod   up -d --build
#
# All tunables live in the env file passed to --env-file.

name: escro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-loaded on first init only (when the data volume is empty)
      - ./escro_platform_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - escro_net

  backend:
    build:
      context: ./escro-platform/backend
      dockerfile: Dockerfile
    image: escro/backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000

      # DB — host is the compose service name
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_SECURE: ${EMAIL_SECURE}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL}

      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}

      SENTRY_DSN: ${BACKEND_SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Exposed for direct testing only; in prod, traffic goes through frontend/nginx.
      - "${BACKEND_PORT_HOST:-5000}:5000"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - escro_net

  frontend:
    build:
      context: ./escro-platform/frontend
      dockerfile: Dockerfile
      args:
        VITE_SENTRY_DSN: ${FRONTEND_SENTRY_DSN:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    image: escro/frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT_HOST:-3000}:80"
    networks:
      - escro_net

volumes:
  postgres_data:
  backend_uploads:

networks:
  escro_net:
    driver: bridge
