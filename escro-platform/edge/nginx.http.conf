# Edge nginx — HTTP-only (initial bootstrap, before SSL cert is issued)
# Used ONLY to serve the ACME challenge and let certbot issue the certificate.
# After cert is issued, swap this file for nginx.https.conf and reload nginx.

server {
    listen 80;
    server_name _;

    # ACME http-01 challenge path (certbot writes tokens here)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else: proxy to frontend so the site is reachable on plain HTTP
    # during the bootstrap window.
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass websocket upgrades (socket.io polling fallback)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
    }
}
