# Edge nginx — HTTPS production config.
# Activate AFTER the Let's Encrypt cert has been issued for your domain.
# Replace ${DOMAIN} with your actual domain (e.g. escro.ro) before mounting.

server {
    listen 80;
    server_name ${DOMAIN} www.${DOMAIN};

    # Keep ACME challenge reachable on plain HTTP for renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Force HTTPS for everything else
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN} www.${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — uncomment once you're sure HTTPS works (do NOT enable during testing)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Allow large uploads (deliverables can be up to 50MB)
    client_max_body_size 55M;

    # Forward everything to the frontend container.
    # The frontend's internal nginx routes /api, /socket.io, /uploads to backend:5000,
    # and serves the SPA for all other paths.
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for socket.io
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
