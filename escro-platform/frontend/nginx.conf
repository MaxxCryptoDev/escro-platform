# nginx site config for ESCRO frontend
# Serves the Vite-built SPA and reverse-proxies API/socket/uploads to backend.

upstream escro_backend {
    server backend:5000;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reasonable file-upload ceiling (matches multer 50MB limit)
    client_max_body_size 55M;

    # Gzip
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache static assets aggressively (Vite outputs hashed filenames)
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API → backend
    location /api/ {
        proxy_pass http://escro_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # User-uploaded files served from backend disk
    location /uploads/ {
        proxy_pass http://escro_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Socket.io (HTTP polling + WebSocket upgrade)
    location /socket.io/ {
        proxy_pass http://escro_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback: any unknown path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
